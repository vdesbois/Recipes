<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f6f5f0">
    <title>Recipe | My Recipes</title>
    <link rel="stylesheet" href="styles.css">
    <script type="module" src="recipe-page.js"></script>
  </head>
  <body data-title-key="detail.title">
    <main class="app-shell">
      <header class="topbar">
        <a class="brand" href="/" aria-label="My Recipes home" data-i18n-aria-label="brand.home">
          <span class="brand-mark" aria-hidden="true">✳</span>
          <span>mise</span>
        </a>
        <span class="topbar-label" data-i18n="brand.tagline">YOUR PERSONAL RECIPE BOX</span>
        <nav class="locale-switch" aria-label="Language" data-i18n-aria-label="locale.navigation">
          <details class="locale-dropdown">
            <summary class="locale-trigger" aria-label="Select language" data-i18n-aria-label="locale.select">
              <span class="locale-current-flag" data-current-locale-flag aria-hidden="true"></span>
              <span data-current-locale-label>EN</span>
              <span class="locale-chevron" aria-hidden="true">⌄</span>
            </summary>
            <div class="locale-options">
              <button type="button" class="locale-option" data-locale="fr" aria-current="false">
                <svg class="locale-flag quebec-flag" viewBox="0 0 48 32" aria-hidden="true">
                  <rect width="48" height="32" fill="#003da5"/>
                  <path d="M19 0h10v11h19v10H29v11H19V21H0V11h19z" fill="#fff"/>
                  <text x="8" y="9" fill="#fff" font-size="7">⚜</text>
                  <text x="35" y="9" fill="#fff" font-size="7">⚜</text>
                  <text x="8" y="30" fill="#fff" font-size="7">⚜</text>
                  <text x="35" y="30" fill="#fff" font-size="7">⚜</text>
                </svg>
                <span data-i18n="locale.frenchOption">Français (Québec)</span>
              </button>
              <button type="button" class="locale-option" data-locale="en" aria-current="false">
                <svg class="locale-flag canada-flag" viewBox="0 0 48 32" aria-hidden="true">
                  <rect width="48" height="32" fill="#fff"/>
                  <path d="M0 0h12v32H0zM36 0h12v32H36z" fill="#d80621"/>
                  <path d="M24 5l2 5 4-2-2 5 5 1-4 3 2 4-5-1-2 6-2-6-5 1 2-4-4-3 5-1-2-5 4 2z" fill="#d80621"/>
                </svg>
                <span data-i18n="locale.englishOption">English (Canada)</span>
              </button>
            </div>
          </details>
        </nav>
      </header>

      <p class="loading-status" id="loading-status" role="status" data-i18n="detail.loading">Loading your recipe…</p>
      <div class="notice notice-row" id="recipe-error" role="alert" hidden>
        <span id="recipe-error-message"></span>
        <a class="button button-quiet" href="/" data-i18n="detail.backToRecipes">Back to recipes</a>
      </div>
      <article class="recipe-detail" id="recipe-detail" hidden>
        <a class="detail-back-link" href="/" data-i18n="detail.allRecipes">← All recipes</a>
        <div class="recipe-detail-heading">
          <div>
            <p class="eyebrow" id="detail-category"></p>
            <h1 id="detail-name"></h1>
            <p class="recipe-detail-rating" id="detail-rating"></p>
          </div>
          <a class="button button-primary" id="edit-recipe" href="/" data-i18n="detail.edit">Edit recipe</a>
        </div>
        <div class="recipe-detail-gallery" id="detail-gallery"></div>
        <section class="recipe-detail-section" id="detail-cooking-section" hidden>
          <h2 data-i18n="detail.cooking">Cooking details</h2>
          <dl class="recipe-meta">
            <div id="detail-cooking-time-row" hidden>
              <dt data-i18n="detail.cookingTime">Cooking time</dt>
              <dd id="detail-cooking-time"></dd>
            </div>
            <div id="detail-cooking-temperature-row" hidden>
              <dt data-i18n="detail.temperature">Cooking temperature</dt>
              <dd id="detail-cooking-temperature"></dd>
            </div>
            <div id="detail-servings-row" hidden>
              <dt data-i18n="detail.servings">Servings</dt>
              <dd id="detail-servings"></dd>
            </div>
          </dl>
        </section>
        <section class="recipe-detail-section" id="detail-notes-section" hidden>
          <h2 data-i18n="detail.notes">Notes</h2>
          <p class="recipe-detail-notes" id="detail-notes"></p>
        </section>
        <section class="recipe-detail-section" id="detail-ingredients-section" hidden>
          <h2 data-i18n="detail.ingredients">Ingredients</h2>
          <ul class="recipe-ingredients" id="detail-ingredients"></ul>
        </section>
        <section class="recipe-detail-section" id="detail-steps-section" hidden>
          <h2 data-i18n="detail.instructions">Instructions</h2>
          <ol class="recipe-steps" id="detail-steps"></ol>
        </section>
      </article>
      <footer class="footer"><span data-i18n="footer">Made for the recipes that feel like home</span> <span aria-hidden="true">♥</span></footer>
    </main>
  </body>
</html>
